function actor(im,x,foot,height,flip=false){
 const width=height*im.width/im.height;
 ctx.save();ctx.translate(x,foot);if(flip)ctx.scale(-1,1);ctx.drawImage(im,-width/2,-height,width,height);ctx.restore();
}
function scene(index,y,height,time,alpha=1,offset=0){
 const full=clamp((height-PH)/(H-PH)),reverse=index%2===1;
 ctx.save();ctx.beginPath();ctx.rect(0,y,W,height);ctx.clip();ctx.globalAlpha=alpha;ctx.translate(offset,y);
 const bg=images['bg'+index],sourceH=Math.min(bg.height,bg.width*height/W),sourceY=(bg.height-sourceH)*(.31*(1-full));
 ctx.save();if(reverse){ctx.translate(W,0);ctx.scale(-1,1);}ctx.drawImage(bg,0,sourceY,bg.width,sourceH,0,0,W,height);ctx.restore();
 const shade=ctx.createLinearGradient(0,0,0,height);shade.addColorStop(0,'rgba(12,22,35,.17)');shade.addColorStop(.6,'rgba(12,22,35,0)');shade.addColorStop(1,'rgba(12,22,35,.23)');ctx.fillStyle=shade;ctx.fillRect(0,0,W,height);
 const nearH=PH*.90+(270-PH*.90)*full,farH=nearH*.52;
 const nearX=W*(reverse?.80:.20),farX=W*(reverse?.20:.80);
 const nearFoot=height*(.97-.08*full),farFoot=height*(.60-.09*full);
 const frame=reduced?0:Math.min(59,Math.floor(time/1000*12));
 ctx.fillStyle='rgba(18,26,27,.25)';ctx.beginPath();ctx.ellipse(farX,farFoot+4,farH*.23,farH*.045,0,0,Math.PI*2);ctx.fill();
 actor(images['easy'+frame],farX,farFoot,farH,reverse);
 ctx.fillStyle='rgba(18,26,27,.28)';ctx.beginPath();ctx.ellipse(nearX,nearFoot+1,nearH*.19,nearH*.035,0,0,Math.PI*2);ctx.fill();
 actor(images['hero'+index],nearX,nearFoot,nearH,reverse);
 ctx.restore();
}
function render(time){
 ctx.setTransform(2,0,0,2,0,0);ctx.fillStyle='#101916';ctx.fillRect(0,0,W,H);
 let phase='hero',count=0;
 if(time<500){scene(0,0,H,time);}
 else{
  for(let i=0;i<4;i++){
   const age=time-(500+i*400);if(age<0)continue;count++;
   const p=reduced?1:ease(age/350);scene(i,i*(PH+GAP),PH,time,p,(i%2?-1:1)*(1-p)*W*.30);
  }
  phase=count<4?'enter':'hold';
  if(time>=2850){const p=reduced?1:ease((time-2850)/600);scene(0,0,PH+(H-PH)*p,time);phase=p<1?'expand':'returned';}
 }
 canvas.dataset.phase=phase;canvas.dataset.panels=String(count);canvas.dataset.motionFrame=String(reduced?0:Math.min(59,Math.floor(time/1000*12)));
}
function stop(){cancelAnimationFrame(raf);raf=0;playing=false;button.disabled=false;button.textContent='もう一度見る';}
button.addEventListener('click',()=>{if(playing)return;playing=true;button.disabled=true;status.textContent='再生中';const start=performance.now();
 function tick(now){const elapsed=now-start;render(elapsed);if(elapsed<3950){raf=requestAnimationFrame(tick);}else{stop();status.textContent='再生終了';}}
 raf=requestAnimationFrame(tick);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden&&playing){stop();render(0);status.textContent='停止';}});
Promise.all(Object.entries(assets).map(([name,src])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{images[name]=im;resolve();};im.onerror=reject;im.src=src;}))).then(()=>{render(0);button.disabled=false;status.textContent='構図・動きの試作';}).catch(()=>{status.textContent='画像を読み込めませんでした';});
})();
</script>
</body></html>
