 const decoded={};
 const backgrounds=['field','town','snow','glass','port'],children=['hero','traveler','historian','inventor','older'];
 const load=Promise.all(Object.entries(assets).map(([name,url])=>new Promise((resolve,reject)=>{const im=new Image();im.onload=()=>{decoded[name]=im;resolve();};im.onerror=reject;im.src=url;})));
 function scene(index,x,y,w,h){
  ctx.save();ctx.beginPath();ctx.rect(x,y,w,h);ctx.clip();
  const bg=decoded[backgrounds[index]],k=Math.max(w/bg.width,h/bg.height);ctx.drawImage(bg,x+(w-bg.width*k)/2,y+(h-bg.height*k)*.65,bg.width*k,bg.height*k);
  const base=Math.min(h*.32,w*.48),heroH=base*(index===4?1.12:1),easyH=base*1.25/1.65;
  function actor(img,cx,foot,hh){const ww=hh*img.width/img.height;ctx.fillStyle='rgba(24,30,26,.18)';ctx.beginPath();ctx.ellipse(cx,foot,ww*.31,hh*.027,0,0,Math.PI*2);ctx.fill();ctx.drawImage(img,cx-ww/2,foot-hh,ww,hh);}
  actor(decoded.easy,x+w*.70,y+h*.50,easyH);actor(decoded[children[index]],x+w*.30,y+h*.87,heroH);ctx.restore();
 }
 function draw(beat){
  if(canvas.dataset.beat===String(beat))return;
  canvas.dataset.beat=String(beat);ctx.clearRect(0,0,390,660);
  if(beat===5){const gap=3;for(let i=0;i<4;i++)scene(i+1,(i%2)*(195+gap/2),Math.floor(i/2)*(330+gap/2),195-gap/2,330-gap/2);}
  else scene(beat,0,0,390,660);
 }
 let raf=0;
 load.then(()=>{draw(0);button.disabled=false;status.textContent='構図・間合いの試作';}).catch(()=>{status.textContent='画像を読み込めませんでした';});
 button.addEventListener('click',()=>{
  cancelAnimationFrame(raf);button.disabled=true;status.textContent='再生中';const start=performance.now();draw(0);
  function tick(now){const t=now-start;
   if(t<550)draw(0);
   else if(t<1350)draw(1+Math.min(3,Math.floor((t-550)/200)));
   else if(t<1750)draw(5);
   else draw(0);
   if(t<2250)raf=requestAnimationFrame(tick);
   else{button.disabled=false;button.textContent='もう一度見る';status.textContent='再生終了';}
  }
  raf=requestAnimationFrame(tick);
 });
 document.addEventListener('visibilitychange',()=>{if(document.hidden&&raf){cancelAnimationFrame(raf);draw(0);button.disabled=false;status.textContent='停止';}});
